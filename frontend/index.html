<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MACTEE · Recupero materie prime strategiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#EEF0EA; --surface:#FFFFFF; --deep:#13272B; --deep2:#1B343A;
    --green:#1F5A43; --green2:#2E7A5B; --copper:#B5651D; --gold:#C2912C;
    --ink:#16211D; --mute:#6C7C73; --line:#E2E6DD;
    --critico:#B5651D; --strategico:#C2912C; --utile:#4E8C72;
    --red:#B23B2E; --orange:#E07B00;
    --onDark:#EAF1ED; --onDarkMute:#9DB0A8;
    --r:14px; --shadow:0 6px 20px rgba(15,30,28,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--ink);
    display:grid;grid-template-rows:auto 1fr;min-height:100%}
  h1,h2,h3{font-family:Fraunces,Georgia,serif}

  header{background:var(--deep);color:var(--onDark);padding:14px 22px;display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--green2);display:grid;place-items:center;font-family:Fraunces;font-weight:700;font-size:19px;color:#fff;flex:none}
  .brand h1{font-size:18px;margin:0;font-weight:600;line-height:1.15}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--onDarkMute)}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
  nav.tabs button{background:var(--deep2);border:1px solid transparent;color:var(--onDarkMute);font-family:Inter;font-weight:600;font-size:12px;
    padding:8px 12px;border-radius:10px;cursor:pointer;transition:.15s}
  nav.tabs button:hover{color:var(--onDark)}
  nav.tabs button.active{background:var(--green2);color:#fff}
  #connStatus{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:600}
  #connStatus.ok{background:#1F5A43;color:#fff}
  #connStatus.ko{background:var(--red);color:#fff}
  .hdrbtn{background:var(--deep2);border:1px solid #2C4A50;color:var(--onDark);font-family:Inter;font-weight:600;font-size:11.5px;padding:7px 11px;border-radius:9px;cursor:pointer}
  .hdrbtn:hover{background:var(--green2);border-color:var(--green2)}

  .wrap{display:grid;grid-template-columns:270px 1fr;min-height:0}
  .wrap.nosidebar{grid-template-columns:1fr}
  aside{background:var(--surface);border-right:1px solid var(--line);padding:14px 16px;overflow:auto}
  main{padding:22px 24px;overflow:auto}
  .fgroup{margin-bottom:16px}
  .fgroup>.h{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:10px}
  .type{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .type button{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 2px 7px;cursor:pointer;font-family:Inter;font-size:11.5px;color:var(--ink);font-weight:600;transition:.15s;text-align:center;width:100%;min-width:0}
  .type button .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;flex:none;color:#fff}
  .type button[aria-pressed="true"]{border-color:var(--green);background:#F1F7F3;box-shadow:0 0 0 1px var(--green) inset}
  .type button[aria-pressed="false"]{opacity:.6}
  select,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-family:Inter;font-size:13.5px;background:#fff;color:var(--ink)}
  select:disabled,input:disabled{background:#F5F6F2;color:var(--mute)}
  select:not(:disabled):focus, input:not(:disabled):focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
  .mwrow{display:flex;align-items:center;gap:12px}
  .mwrow input[type=range]{flex:1;accent-color:var(--green)}
  .mwval{font-family:Fraunces;font-weight:700;font-size:20px;color:var(--green);min-width:74px;text-align:right}
  .mwval small{font-family:Inter;font-size:12px;color:var(--mute);font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#FBF2E7;color:var(--copper);border:1px solid #EBD7BE;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;margin-top:8px}
  .mode-toggle{display:flex;gap:8px;margin-bottom:14px}
  .mode-btn{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:Inter;font-size:12px;font-weight:600;color:var(--mute)}
  .mode-btn.active{border-color:var(--green);background:#F1F7F3;color:var(--green)}
  .comp-mini-label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:700;margin-bottom:3px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);font-weight:600}
  .kpi .v{font-size:22px;font-weight:600;margin-top:5px;color:var(--green);line-height:1}
  .kpi .v small{font-size:12px;color:var(--ink);font-weight:600;font-family:Inter}
  .kpi .s{font-size:11.5px;color:var(--mute);margin-top:5px}
  .kpi.copper .v{color:var(--copper)}
  .kpi.net .v.pos{color:var(--green)} .kpi.net .v.neg{color:var(--red)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel h3{margin:0 0 2px;font-size:16.5px;font-weight:600}
  .panel .sub{font-size:12px;color:var(--mute);margin:0 0 14px}

  .path{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin-bottom:16px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:11px}
  .path-step{display:flex;flex-direction:column;gap:2px;padding:4px 12px;min-width:88px}
  .path-step .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
  .path-step .val{font-size:12px;font-weight:700;color:var(--ink)}
  .path-step .val.empty{color:var(--mute);font-weight:400;font-style:italic}
  .path-arrow{color:var(--mute);font-size:15px;padding:0 2px}

  /* ---- schema del processo unico ---- */
  .flow-impianto-label{font-size:11px;font-weight:700;color:var(--mute);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .lane{margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
  .lane:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .lane-row{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
  .lane-arrow{color:var(--mute);font-size:13px;margin-top:24px;flex:none}
  .lane-node{border:1px solid var(--line);border-radius:9px;background:#F1F7F3;border-color:var(--green);padding:9px 12px;min-width:300px;max-width:380px}
  .lane-node select{padding:4px 6px;font-size:12px;border:none;background:transparent;font-weight:700;color:var(--ink);margin-bottom:2px;width:100%}
  .lane-node .lane-node-cost,.lane-node .lane-node-costo-tot{font-size:12px}
  .lane-node .lane-node-fasi{font-size:10.5px}
  /* taglia dell'impianto e capex (v9.1) */
  .taglia-box{margin:6px 0;padding:7px 9px;border-radius:8px;background:#fff;border:1px solid #CFE3D7}
  .taglia-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink)}
  .taglia-row input{width:110px;padding:4px 6px;font-size:12px;border:1px solid var(--line);border-radius:6px;text-align:right}
  .taglia-kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:11.5px;margin-top:5px;color:var(--mute)}
  .taglia-kv b{color:var(--ink);font-weight:600;text-align:right}
  .taglia-nota{font-size:10.5px;color:var(--mute);margin-top:4px}
  .lane-node-title{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:2px}
  .lane-node-cost{font-size:9.5px;color:var(--green2);font-weight:600}
  .lane-node-costo-tot{font-size:10.5px;color:var(--copper);font-weight:700;margin-top:1px}
  .lane-node-fasi{font-size:9px;color:var(--mute);margin-top:2px;line-height:1.4}
  /* reagenti e bilancio di massa (v9) */
  .reag-box{margin:6px 0 4px;padding:6px 8px;border-radius:8px;background:#FBF2E7;border:1px solid #EBD7BE}
  .reag-h{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--copper);font-weight:700;margin-bottom:3px}
  .reag-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:600;color:var(--ink)}
  .reag-row.nonspec{color:var(--copper);font-style:italic;font-weight:500}
  .bil-strip{margin:8px 0 2px;padding:7px 12px;border-radius:9px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .bil-strip.ok{background:#EAF3EE;border:1px solid #CFE3D7;color:#1F4D3E}
  .bil-strip.ko{background:#FBECEA;border:1px solid #EBC4BF;color:#8E2B22}
  .bil-esito{font-weight:700}
  .bil-nota{font-size:11px;color:var(--copper)}

  .lane-card-toggle{display:flex;align-items:flex-start;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;cursor:pointer;text-align:left;font-family:Inter;min-width:150px;max-width:190px}
  .lane-card-toggle.active{border-color:var(--green);background:#F1F7F3}
  .lane-card-toggle .ic{width:26px;height:26px;border-radius:8px;background:var(--line);color:var(--mute);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none;font-family:Fraunces}
  .lane-card-toggle.active .ic{background:var(--green);color:#fff}
  .comp-name{font-size:12.5px;font-weight:700;color:var(--ink)}
  .comp-mass-val{font-family:Fraunces;font-weight:700;font-size:12.5px;color:var(--ink);margin-top:2px}

  .lane-uscite{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;position:relative;
    padding:10px 10px 12px;border:1.5px dashed var(--line);border-radius:11px;background:rgba(241,243,236,.55)}
  .uscite-label{flex-basis:100%;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--mute);margin-bottom:1px}
  .output-branch{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
  .output-card{width:126px;border:1.5px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff;position:relative}
  .output-card.clickable{cursor:pointer;transition:.12s}
  .output-card.clickable:hover{box-shadow:0 2px 8px rgba(31,90,67,.12)}
  .output-card.default{border-color:var(--line)}
  .output-card.custom{border-color:var(--gold);background:#FFFBF2;box-shadow:0 0 0 1px var(--gold) inset}
  .output-card.scarto{background:#F4F5F1;border-style:dashed;border-color:#C7CDBE}
  .output-card.scarto .nm{font-style:italic}
  .output-card .cat{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%}
  .output-card .sym{font-family:Fraunces;font-weight:700;font-size:15px;line-height:1;color:var(--ink)}
  .output-card .nm{font-size:9px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .output-card .val{font-size:11px;font-weight:700;margin-top:5px}
  .output-card .vv{font-size:10px;color:var(--green2);font-weight:700;margin-top:1px}
  .price-tag{font-size:9px;color:var(--mute);margin-top:3px}
  .custom-badge{font-size:8.5px;font-weight:700;color:var(--gold);margin-top:3px;text-transform:uppercase;letter-spacing:.02em}
  .intermedio-header{background:#FBF6E9;border-color:var(--gold)}
  .btn-trasforma{margin-top:6px;width:126px;padding:5px 6px;border:1px solid var(--gold);border-radius:7px;background:#FBF6E9;color:var(--gold);font-family:Inter;font-weight:700;font-size:9.5px;cursor:pointer}
  .btn-trasforma:hover{background:var(--gold);color:#fff}
  .trasforma-tag{font-size:8.5px;font-weight:700;color:var(--gold);margin-top:4px;cursor:pointer}
  .trasforma-tag:hover{text-decoration:underline}

  .tiles{display:flex;flex-wrap:wrap;gap:9px}
  .tile{width:100px;border:1.5px solid var(--line);border-radius:10px;padding:9px 9px 8px;background:#fff;position:relative}
  .tile.clickable{cursor:pointer;transition:.12s}
  .tile.clickable:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(31,90,67,.12)}
  .tile.default{border-color:var(--line)}
  .tile.custom{border-color:var(--gold);background:#FFFBF2;box-shadow:0 0 0 1px var(--gold) inset}
  .tile .sym{font-family:Fraunces;font-weight:700;font-size:22px;line-height:1}
  .tile .nm{font-size:10px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .val{font-size:12px;font-weight:700;margin-top:6px}
  .tile .vv{font-size:10.5px;color:var(--mute);font-weight:600;margin-top:1px}
  .tile .cat{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
  .legend{display:flex;gap:15px;margin-top:14px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
  .legend i{width:10px;height:10px;border-radius:50%}
  .legend i.sq{border-radius:3px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mute);font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  td.name{font-weight:400;color:var(--mute);text-align:left}
  tbody tr:hover{background:#F8F9F5}

  .empty-state{text-align:center;padding:40px 20px;color:var(--mute);font-size:14px}
  .footer{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.5}
  code{background:#F1F3EC;padding:1px 5px;border-radius:4px;font-size:11px}
  *:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar .cnt{font-size:11px;color:var(--mute);background:#F1F3EC;padding:4px 10px;border-radius:999px;font-weight:600}
  .btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:Inter;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .btn:hover{border-color:var(--green)}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.primary:hover{background:#194A38}
  .db-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table.dbtable{font-size:12.5px;min-width:100%}
  table.dbtable th{background:#F8F9F5;text-align:left;padding:9px 10px}
  table.dbtable td{padding:5px 6px;text-align:left;vertical-align:middle}
  table.dbtable td.actions{text-align:center;width:36px}
  table.dbtable input,table.dbtable select{padding:6px 7px;font-size:12.5px;border-radius:7px;min-width:70px}
  table.dbtable input[type=text]{min-width:110px}
  table.dbtable input.saved{border-color:var(--green)!important;background:#F1F7F3}
  table.dbtable input.error,table.dbtable select.error{border-color:var(--red)!important;background:#FDF3F1}
  .rowdel{border:none;background:transparent;color:var(--mute);cursor:pointer;font-size:15px;border-radius:6px;padding:4px 7px}
  .rowdel:hover{color:var(--red);background:#FDF3F1}
  .db-note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.6}
  .newrow td{background:#FBF6E9}

  .modal-overlay{position:fixed;inset:0;background:rgba(19,39,43,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .modal{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:80vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 14px}
  .modal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .modal-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
  .modal-badge.ok{background:#E1F5EE;color:var(--green)}
  .modal-badge.warn{background:#FDF3F1;color:var(--red)}
  .modal-errs{font-size:11.5px;color:var(--red);margin:6px 0 0;padding-left:16px}
  .modal-close{margin-top:16px;display:flex;gap:8px}

  .modal.wide{max-width:820px}
  .output-card .sym,.tile .sym{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
  .output-card .sym.sym-long{font-size:11.5px;line-height:1.3}
  .tile .sym.sym-long{font-size:14px;line-height:1.6}
  .comp-col{display:flex;flex-direction:column;gap:5px}
  .btn-assiemi{font-family:Inter;font-size:9.5px;font-weight:700;color:var(--green);background:#F1F7F3;border:1px solid var(--green);border-radius:7px;padding:4px 7px;cursor:pointer;max-width:220px}
  .btn-assiemi:hover{background:var(--green);color:#fff}
  .assieme-tag{font-size:9.5px;color:var(--copper);font-weight:700;margin-top:1px;line-height:1.3}
  .lane.lane-sep{background:#FBF8F1;border-radius:11px;padding:10px;border:1px dashed #E6D8BC}
  .ass-list{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .ass-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
  .ass-row:hover{background:#F8F9F5}
  .ass-row input{width:auto}
  .ass-nome{flex:1}
  .ass-m{color:var(--mute);font-size:11px;white-space:nowrap}
  /* liste a caselle nel pannello laterale (impianti, macrocomponenti) */
  .chk-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .chk-list .ass-row{padding:6px 8px;font-size:12px;line-height:1.3;flex-wrap:wrap;row-gap:1px}
  .chk-list .ass-nome{flex:1 1 0;min-width:0}
  .chk-list .ass-m{flex-basis:100%;padding-left:21px;white-space:normal}
  .chk-list .ass-row:last-child{border-bottom:none}
  .chk-list .ass-row.off{color:var(--mute)}
  /* menu a tendina con caselle (impianti, macrocomponenti): la barra resta compatta */
  .dd{position:relative}
  .dd-btn{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-family:Inter;font-size:13.5px;background:#fff;color:var(--ink);cursor:pointer;text-align:left}
  .dd-btn .dd-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-btn .dd-lbl.vuoto{color:var(--mute)}
  .dd-car{color:var(--mute);font-size:11px;transition:transform .15s}
  .dd.open .dd-btn{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
  .dd.open .dd-car{transform:rotate(180deg)}
  .dd-panel{display:none;position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;flex-direction:column}
  .dd.open .dd-panel{display:flex}
  .dd-panel .chk-list{max-height:none;flex:1 1 auto;min-height:0;border:1px solid var(--line)}
  .dd-cerca{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:Inter;font-size:12.5px;margin-bottom:6px}
  .dd-cerca:focus{outline:none;border-color:var(--green)}
  .chk-list .ass-row.nascosto{display:none}
  .dd-vuoto{display:none;padding:10px;font-size:12px;color:var(--mute)}
  .chk-tools{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .chk-tools .dd-conta{margin-left:auto;font-size:11px;color:var(--mute)}
  .chk-tools button{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--ink)}

const ANNO_CORRENTE = 2026;
const CATCOL={critico:'var(--critico)',strategico:'var(--strategico)',utile:'var(--utile)'};

async function apiGet(path, params){
  const url = new URL(API+path, window.location.origin);
  if(params) Object.entries(params).forEach(([k,v])=>{ if(v!==undefined && v!==null && v!=='') url.searchParams.set(k,v); });
  const r = await fetch(url);
  if(!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail || r.statusText);
  return r.json();
}
async function apiSend(method, path, body){
  const url = new URL(API+path, window.location.origin);
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail || r.statusText);
  return r.status===204 ? null : r.json();
}
async function checkHealth(){
  const el = document.getElementById('connStatus');
  try{
    const h = await apiGet('/health');
    if(h.status==='ok'){ el.textContent='● Postgres connesso'; el.className='ok'; }
    else{ el.textContent='● Database non raggiungibile'; el.className='ko'; }
  }catch(e){ el.textContent='● API non raggiungibile'; el.className='ko'; }
}

function showModal(innerHtml){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}

// ---- menu a tendina della barra laterale (impianti, macrocomponenti) ----
// il pannello e' in posizione fissa, cosi' non viene tagliato dallo scorrimento della barra.
// Si apre DI FIANCO alla barra laterale (allineato al pulsante), cosi' non copre le scelte
// sottostanti: scegliendo gli impianti si vedono aggiornarsi i macrocomponenti.
let ddAperto = null;   // 'imp' | 'mac' | null
const ddCerca = {};    // testo cercato in ogni tendina
function applicaRicerca(inp){
  const q = inp.value.trim().toLowerCase();
  const lst = inp.closest('.dd-panel').querySelector('.chk-list');
  let n = 0;
  lst.querySelectorAll('.ass-row').forEach(r=>{
    const ok = !q || r.textContent.toLowerCase().includes(q);
    r.classList.toggle('nascosto', !ok); n += ok;
  });
  lst.querySelector('.dd-vuoto').style.display = n ? 'none' : 'block';
}
function posizionaTendina(){
  const dd = ddAperto && document.querySelector(`#aside .dd[data-dd="${ddAperto}"]`);
  if(!dd){ ddAperto = null; return; }
  const r = dd.querySelector('.dd-btn').getBoundingClientRect(), p = dd.querySelector('.dd-panel');
  const barra = document.getElementById('aside').getBoundingClientRect();
  const larg = 340, spazioDestra = window.innerWidth - barra.right - 24;
  if(spazioDestra >= larg){
    // di fianco alla barra, allineato al pulsante; alzato solo quanto serve se il contenuto
    // (altezza reale, non una fissa) non sta sotto
    // una lista lunga scorre dentro il pannello; si alza solo se sotto restano meno di 360 px
    p.style.maxHeight = 'none';
    const naturale = p.scrollHeight, spazioSotto = window.innerHeight - (r.top - 8) - 12;
    const h = Math.min(naturale, Math.max(spazioSotto, Math.min(360, naturale)), window.innerHeight * 0.8);
    const top = Math.max(12, Math.min(r.top - 8, window.innerHeight - h - 12));
    Object.assign(p.style, { left:(barra.right+12)+'px', width:larg+'px', maxHeight:h+'px', top:top+'px', bottom:'auto' });
    return;
  }
  // schermo stretto: sotto (o sopra) il pulsante come prima
  const w = Math.min(Math.max(r.width, 320), window.innerWidth - r.left - 12);
  const sotto = window.innerHeight - r.bottom - 12, sopra = r.top - 12;
  const giu = sotto >= 220 || sotto >= sopra;
  const h = Math.min(giu ? sotto : sopra, window.innerHeight * 0.65);
  Object.assign(p.style, { left:r.left+'px', width:w+'px', maxHeight:h+'px',
    top: giu ? (r.bottom+4)+'px' : 'auto', bottom: giu ? 'auto' : (window.innerHeight - r.top + 4)+'px' });
}
function chiudiTendina(){
  if(!ddAperto) return;
  ddAperto = null;
  document.querySelectorAll('#aside .dd.open').forEach(d=>d.classList.remove('open'));
}
document.addEventListener('mousedown', e=>{ if(ddAperto && !e.target.closest('.dd')) chiudiTendina(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') chiudiTendina(); });
window.addEventListener('resize', posizionaTendina);
document.addEventListener('scroll', e=>{ if(ddAperto && !e.target.closest?.('.dd-panel')) posizionaTendina(); }, true);

// macrocomponenti trattabili per gli impianti scelti (masse sommate); tiene le scelte ancora valide
async function aggiornaMacroDisponibili(){
  const s = calcState;
  s.macroDisponibili = s.impianti.length ? await apiGet('/filtri/macrocomponenti', {id_imps:s.impianti.join(',')}) : [];
  const nomi = s.macroDisponibili.map(m=>m.macro_componente);
  s.macroSel = s.macroSel.filter(m=>nomi.includes(m));
  if(!s.macroSel.length && nomi.length===1) s.macroSel = [...nomi];
  Object.keys(s.separati).forEach(m=>{ if(!nomi.includes(m)) delete s.separati[m]; });
  rebuildLanes();
}

// corsie dello schema: una per macrocomponente scelto (resto) + una per ogni assieme separato
const laneKey = (macro, assieme) => assieme ? macro+'##'+assieme : macro;
function rebuildLanes(){
  const s = calcState;
  const scelti = s.macroDisponibili.filter(m=>s.macroSel.includes(m.macro_componente));
  const nuovi = {};
  const corsia = (k, m, assieme)=>{
    const vecchia = s.componenti[k];
    // i processi disponibili dipendono dagli impianti scelti: si tiene quello scelto se ancora valido
    const valido = vecchia && m.processi.some(p=>p.id_processo===vecchia.idProcesso);
    nuovi[k] = valido ? {...vecchia, processoOptions:m.processi}
      : { macro:m.macro_componente, assieme, processoOptions:m.processi, idProcesso:m.processi[0]?.id_processo||null, figli:{} };
  };
  scelti.forEach(m=>{
    corsia(laneKey(m.macro_componente, null), m, null);
    (s.separati[m.macro_componente]||[]).forEach(a=>corsia(laneKey(m.macro_componente, a), m, a));
  });
  s.componenti = nuovi;
}

function resetSelection(){
  const s = calcState;
  s.tipologia=''; s.sotto=''; s.impianti=[]; s.macroSel=[]; s.macroDisponibili=[]; s.componenti={}; s.separati={};
  s.prezziManuali={prodotti:{},intermedi:{}};
  s.diretto=initDiretto();
}

// ---- albero ricorsivo delle scelte di trasformazione intermedi ----
function getFiglioState(macro, path, create){
  let figli = (macro === 'DIRETTO') ? calcState.diretto.figli : calcState.componenti[macro].figli;
  let node = null;
  for(let i=0;i<path.length;i++){
    const code = path[i];
    if(!figli[code]){
      if(!create) return null;
      figli[code] = { processing:false, idSottoprocesso:null, sottoprocessoOptions:null, figli:{} };
    }
    node = figli[code];
    figli = node.figli;
  }
  return node;
}
function buildFigliPayload(figliDict){
  const out = {};
  for(const [code, node] of Object.entries(figliDict||{})){
    out[code] = node.processing && node.idSottoprocesso
      ? { id_sottoprocesso: node.idSottoprocesso, figli: buildFigliPayload(node.figli) }
      : { id_sottoprocesso: null };
  }
  return out;
}

const fmt=(n,d=2)=>(+n).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtInt=n=>Math.round(n).toLocaleString('it-IT');
const pct=v=>fmt(v*100,v*100%1?1:0)+'%';
function mass(kg){return kg>=1000?[fmt(kg/1000,2),'t']:[fmt(kg,kg<10?2:0),'kg'];}
const massStr = kg => mass(kg).join(' ');
function eur(v){const a=Math.abs(v);const sign=v<0?'−':'';if(a>=1e6)return[sign+fmt(a/1e6,1),'M €'];if(a>=1e3)return[sign+fmtInt(a/1e3),'k €'];return[sign+fmtInt(a),'€'];}
function componentIcon(name){ return name.replace(/[_/]/g,' ').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function fasiCompact(s){ return (s||'').replaceAll('_',' ').split(',').map(x=>x.trim().toLowerCase()).join(' · '); }
function escAttr(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
const nice = s => (s||'').replaceAll('_',' ');

function pathBar(steps){
  return `<div class="path">${steps.map(([l,v],i)=>`${i>0?'<span class="path-arrow">→</span>':''}<div class="path-step"><span class="lbl">${l}</span><span class="val ${v?'':'empty'}">${v||'—'}</span></div>`).join('')}</div>`;
}

let calcRequestId = 0;
async function renderCalcoloMain(){
  if(calcState.mode==='intermedio') return renderCalcoloMainDiretto();
  const s = calcState;
  const main = document.getElementById('main');
  const imps = s.impianti.map(id=>impiantiCache.find(i=>i.id_imp===id)).filter(Boolean);
  const macros = Object.keys(s.componenti);
  const nMacro = new Set(Object.values(s.componenti).map(c=>c.macro)).size;
  const nSep = macros.length - nMacro;
  const anni = imps.map(i=>i.anno_dismissione);
  const pathHtml = pathBar([
    ['Tipologia', TIPO_ICONS[s.tipologia]?.[2]||''],
    ['Sotto-tecnologia', s.sotto ? (s.sotto===SENZA_SOTTO ? 'nessuna' : s.sotto) : ''],
    ['Impianti', imps.length===1 ? imps[0].nome : imps.length ? `${imps.length} impianti` : ''],
    ['Macrocomponenti', !nMacro ? '' : (nMacro===1 ? Object.values(s.componenti)[0].macro : `${nMacro} macrocomponenti`)
      + (nSep ? ` + ${nSep} assiem${nSep>1?'i':'e'} separat${nSep>1?'i':'o'}` : '')],
    ['Anno dismiss.', !imps.length ? '' : s.annoOverride!=null ? s.annoOverride
      : Math.min(...anni)===Math.max(...anni) ? anni[0] : `${Math.min(...anni)}–${Math.max(...anni)}`]]);

  if(!imps.length || !macros.length){
    const msg = !s.tipologia ? 'Scegli la tipologia di impianto a sinistra.'
      : !s.sotto ? 'Scegli la sotto-tecnologia: raggruppa gli impianti trattabili con lo stesso processo.'
      : !imps.length ? 'Scegli uno o più impianti: le masse dei materiali vengono sommate e il processo è applicato al totale.'
      : !s.macroDisponibili.length ? 'Gli impianti scelti non hanno macrocomponenti con materiali e un processo di trattamento.'
      : 'Scegli uno o più macrocomponenti da trattare.';
    main.innerHTML = pathHtml + `<div class="empty-state">${msg}</div>`;
    return;
  }

  const myId = ++calcRequestId;
  main.innerHTML = pathHtml + `<div class="empty-state">Calcolo in corso…</div>`;
  const body = {
    id_imps: s.impianti, anno_dismissione: s.annoOverride,
    anno_corrente: ANNO_CORRENTE, id_indice_costi: s.indiceCosti,
    componenti: macros.map(k=>{
      const c = s.componenti[k];
      return {
        macro_componente: c.macro, id_processo: c.idProcesso,
        assieme: c.assieme, escludi_assiemi: c.assieme ? null : (s.separati[c.macro]||[]),
        prezzi_prodotti_override: s.prezziManuali.prodotti,
        prezzi_intermedi_override: s.prezziManuali.intermedi,
        figli_processo: buildFigliPayload(c.figli),
        taglia_t_anno: c.taglia || null,
        anno_costruzione: c.annoCostr || null,
      };
    }),
  };
  let data;
  try{ data = await apiSend('POST', '/calcolo-impianto', body); }
  catch(e){
    if(myId!==calcRequestId) return;
    main.innerHTML = pathHtml + `<div class="empty-state">Errore nel calcolo: ${e.message}</div>`;
    return;
  }
  if(myId!==calcRequestId) return;
  lastCalc = data;
  lastCalcBody = body;   // riusato dall'export del bilancio di massa
  // taglia non scritta: la prima proposta (tratta la massa in 1 anno) resta fissa per la corsia,
  // cosi' aggiungendo o togliendo impianti cambia il tempo di trattamento, non l'impianto
  (data.componenti||[]).forEach(cd=>{
    const c = s.componenti[cdKey(cd)];
    if(c && c.taglia == null && cd.processo && cd.processo.taglia_t_anno){
      c.taglia = cd.processo.taglia_t_anno; c.tagliaProposta = true;
    }
  });
  main.innerHTML = pathHtml
    + renderAvvisiPanel(data.componenti)
    + renderSchemaProcesso(data)
    + renderMaterialeRecuperatoPanel(data.componenti)
    + renderElementiPersiPanel(data.componenti)
    + renderEconomicSummary(data, 'Massa macrocomponenti', data.massa_totale_kg, `di cui trattata ${massStr(data.massa_trattata_kg)}`);
  wireSchemaProcesso();
  wireElementiPersi();
  wirePriceTiles();
}

// ============================================================
// SCHEMA DEL PROCESSO (da impianto)
// ============================================================
function renderSchemaProcesso(data){
  const imps = data.impianti || [];
  const chi = imps.length===1 ? imps[0].nome
    : `${imps.length} impianti (masse dei materiali sommate)`;
  return `
  <div class="panel">
    <button class="btn" style="float:right" onclick="exportBilancio(this)" title="Report Excel del calcolo corrente: per ogni materiale in ingresso, quanto va a ogni prodotto (parte pura), alle impurità e agli scarti, con resa, prezzo e ricavo">⬇ Esporta bilancio di massa</button>
    <h3>Schema del processo</h3>
    <p class="sub">${TIPO_ICONS[data.tipologia]?.[2]||data.tipologia} · ${chi} — ${data.componenti.length} corsi${data.componenti.length>1?"e":"a"}, massa totale <b>${massStr(data.massa_totale_kg)}</b>. Clicca sul macrocomponente per vedere i suoi materiali${imps.length>1?' e il contributo di ogni impianto':''}.</p>
    ${imps.length>1 ? `<p class="sub">${imps.map(i=>`${i.nome} <span style="color:var(--mute)">(${i.anno_dismissione_calcolo}, ×${fmt(i.fattore_rivalutazione,3)})</span>`).join(' · ')}</p>` : ''}
    ${data.componenti.map(c=>renderLane(c)).join('')}
  </div>`;
}

const cdKey = cd => laneKey(cd.macro_componente, cd.assieme);

  const cardMacro = `
    <div class="comp-col">
    <button class="lane-card-toggle active" data-materiali-macro="${escAttr(lane)}" title="Vedi i materiali${cd.assieme?' di questo assieme':' del macrocomponente'}">
      <span class="ic">${componentIcon(cd.macro_componente)}</span>
      <div>
        <div class="comp-name">${cd.macro_componente}</div>
        ${cd.assieme ? `<div class="assieme-tag">assieme: ${cd.assieme}</div>` : (nSep ? `<div class="assieme-tag">esclusi ${nSep} assiemi separati</div>` : '')}
        <div class="comp-mass-row"><span class="lbl">totale</span><span class="comp-mass-val">${massStr(cd.massa_componente_kg)}</span></div>
        <div class="comp-mass-row tratt"><span class="lbl" title="Somma dei materiali che il processo selezionato tratta (in verde nella tabella dei materiali)">trattata</span><span class="comp-mass-val">${massStr(cd.massa_trattata_kg)}</span></div>
        <div class="price-tag">${cd.n_materiali} materiali · ${cd.massa_componente_kg ? fmt(cd.massa_trattata_kg/cd.massa_componente_kg*100,1) : '0'}% trattato dal processo</div>
        ${(cd.impianti||[]).length>1 ? `<div class="price-tag">da ${cd.impianti.length} impianti</div>` : ''}
      </div>
    </button>
    ${cd.assieme ? `<button class="btn-assiemi" data-riunisci="${escAttr(lane)}">✕ riunisci al macrocomponente</button>`
      : nAss>1 ? `<button class="btn-assiemi" data-separa="${escAttr(cd.macro_componente)}">Separa assiemi (${nAss}) ▸</button>` : ''}
    </div>`;
  const procNode = `
    <div class="lane-node">
      ${c.processoOptions.length>1 ? `
        <select class="sel-processo" data-macro="${escAttr(lane)}">
          ${c.processoOptions.map(p=>`<option value="${p.id_processo}" ${p.id_processo===c.idProcesso?'selected':''}>${nice(p.tecnica)}</option>`).join('')}
        </select>` : `<div class="lane-node-title">${nice(proc.tecnica)}</div>`}
      ${tagliaHtml(lane, proc, true)}
      <div class="lane-node-cost">Capex attribuito ${eur(proc.capex_eur).join(' ')} · Opex ${eur(proc.opex_eur).join(' ')}</div>
      ${proc.smaltimento_eur>0 ? `<div class="lane-node-cost">Smaltimento scarti ${eur(proc.smaltimento_eur).join(' ')}</div>` : ''}
      <div class="lane-node-costo-tot">Costo: ${eur(proc.costo_eur).join(' ')}</div>
      ${proc.sotto_tecnologia ? `<div class="lane-node-fasi">sotto-tecnologia ${proc.sotto_tecnologia}</div>` : ''}
      ${reagentiNodeHtml(cd.reagenti)}
      <div class="lane-node-fasi">${fasiCompact(proc.descrizione_fasi)}</div>
    </div>`;
  return `<div class="lane ${cd.assieme?'lane-sep':''}"><div class="lane-row">
    ${cardMacro}<span class="lane-arrow">→</span>${procNode}<span class="lane-arrow">→</span>
    ${renderUsciteBox(lane, [], nice(proc.tecnica), cd.uscite, cd.scarti, cd.non_trattato)}

}

// ---- taglia dell'impianto e capex (v9.1) ----
// capex impianto = capex specifico (EUR per t/anno) x taglia; tempo = massa / taglia;
// al materiale va la quota d'uso = capex impianto x tempo / vita utile
const anniStr = a => a>=1 ? `${fmt(a, a<10?2:1)} anni` : `${fmt(a*12, 1)} mesi`;
function tagliaHtml(lane, p, modificabile){
  if(p.taglia_t_anno==null) return '';
  return `<div class="taglia-box">
    <div class="taglia-row">Taglia impianto
      ${modificabile ? `<input type="number" class="inp-taglia" data-lane="${escAttr(lane)}" min="1" step="100"
         value="${Math.round(p.taglia_t_anno)}" title="t/anno trattabili. Vuoto = proposta (tratta la massa in 1 anno): ${fmt(p.taglia_proposta_t_anno,0)} t/anno">`
        : `<b>${fmt(p.taglia_t_anno,0)}</b>`} t/anno</div>
    ${modificabile ? `<div class="taglia-row" style="margin-top:5px">Anno di costruzione
      <input type="number" class="inp-anno-costr" data-lane="${escAttr(lane)}" min="${ANNO_CORRENTE}" max="2100" step="1"
        value="${p.anno_costruzione || ANNO_CORRENTE}" title="Anno a cui si rivaluta il capex dell'impianto (uguale per tutto il gruppo)"></div>` : ''}
    <div class="taglia-kv">
      <span>tempo di trattamento</span><b>${anniStr(p.tempo_anni)}</b>
      <span>capex impianto${p.anno_costruzione ? ` (prezzi ${p.anno_costruzione})` : ''}</span><b>${eur(p.capex_impianto_eur).join(' ')}</b>
      <span>quota d'uso (su ${fmt(p.vita_utile_anni,0)} anni di vita)</span><b>${fmt(p.quota_uso*100, p.quota_uso<0.1?2:1)} %</b>
    </div>
    <div class="taglia-nota">${fmt(p.capex_eur_ton,0)} €/(t/anno) × taglia${p.regola_scala==='0,6' ? ` · regola dello ${fmt(p.esponente_scala,1)} rispetto a ${fmt(p.taglia_riferimento_t_anno,0)} t/anno` : ' (lineare)'}${modificabile && calcState.componenti[lane]?.tagliaProposta ? ' · taglia proposta alla scelta del processo (tratta in 1 anno la massa di quel momento)' : ''}</div>
  </div>`;
}

// ---- reagenti e chiusura del bilancio di massa (v9) ----
const pedici = s => (s||'').replace(/\d/g, d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
function reagentiNodeHtml(reagenti){
  if(!reagenti || !reagenti.length) return '';
  return `<div class="reag-box"><div class="reag-h">Reagenti (stechiometrici)</div>
    ${reagenti.map(r=>`<div class="reag-row ${r.specificato?'':'nonspec'}" title="${escAttr(r.nome)}${r.uso&&r.uso.length?'\nper: '+r.uso.map(x=>pedici(x.prodotto)+' '+massStr(x.massa_kg)).join(', '):''}\nelementi: ${escAttr(r.elementi.map(e=>e.elemento+' '+massStr(e.massa_kg)).join(' · '))}">
      <span>${r.specificato ? pedici(r.formula_chimica||r.reagente) : 'non specificati'}</span><span>${massStr(r.massa_kg)}</span></div>`).join('')}
  </div>`;
}
function bilancioHtml(b){
  if(!b) return '';
  const c = b.centrale;
  const extra = [];
  if(c.reagenti_non_specificati_kg > 1e-6*c.uscite_kg) extra.push(`reagenti non specificati ${massStr(c.reagenti_non_specificati_kg)}`);
  if(c.massa_non_bilanciata_kg > 1e-6*c.uscite_kg) extra.push(`massa non bilanciata ${massStr(c.massa_non_bilanciata_kg)}`);
  return `<div class="bil-strip ${b.chiude?'ok':'ko'}" title="Scenario centrale. Uscite = prodotti + impurità + intermedi + scarti (compresi gli elementi non attribuiti) + non trattato.\nScenario min: chiusura ${massStr(b.min.chiusura_kg)} · max: ${massStr(b.max.chiusura_kg)}">
    <b>Bilancio di massa</b> ingresso ${massStr(c.ingresso_kg)} + reagenti ${massStr(c.reagenti_kg)}${extra.length?' + '+extra.join(' + '):''}
    = uscite ${massStr(c.uscite_kg)} <span class="bil-esito">${b.chiude ? '✓ chiude' : '⚠ differenza '+massStr(c.chiusura_kg)}</span>
    ${b.solo_reagenti_indicati ? '' : '<span class="bil-nota">alcuni elementi non arrivano da un reagente indicato</span>'}
  </div>`;
}

// riquadro con tutte le uscite di un processo/sottoprocesso
function renderUsciteBox(macro, path, tecnica, uscite, scarti, nonTrattato){
  return `<div class="lane-uscite">
    <span class="uscite-label">uscite di "${tecnica}"</span>
    ${uscite.map(u=>renderUscitaCard(macro, path, u)).join('')}
    ${renderScartiCards(macro, path, scarti, (uscite||[]).reduce((a,u)=>a+u.massa_kg+u.impurita_kg,0)+(scarti||[]).reduce((a,x)=>a+x.massa_kg,0))}
    ${nonTrattato && nonTrattato.massa_kg>0 ? `
      <div class="output-card scarto clickable" data-nontrattato-macro="${escAttr(macro)}" title="Materiali del macrocomponente che questo processo non tratta">
        <div class="sym" style="color:var(--mute);font-size:12px">Non trattato</div>
        <div class="nm">${nonTrattato.materiali.length} materiali</div>
        <div class="val">${massStr(nonTrattato.massa_kg)}</div>
        <div class="price-tag">dettaglio ▸</div>
      </div>` : ''}
  </div>`;
}

// ---- elementi (bilancio per elemento) ----
const ND_LABEL = 'n.d.';
const elName = e => e===ND_LABEL ? 'n.d.' : e;
function elTop(lista, n=3){
  return (lista||[]).filter(e=>e.elemento!==ND_LABEL && e.massa_kg>0).slice(0,n).map(e=>`${e.elemento} ${massStr(e.massa_kg)}`).join(' · ');
}
function compTop(comp, n=3){
  return (comp||[]).filter(c=>c.elemento!==ND_LABEL).slice(0,n).map(c=>`${c.elemento} ${fmt(c.frazione*100, c.frazione<0.1?1:0)}%`).join(' · ');
}
function compTitle(comp){
  return (comp||[]).map(c=>`${c.elemento==='n.d.'?'composizione n.d.':c.elemento}: ${fmt(c.frazione*100,2)}%`).join('\n');
}
function elTableHtml(lista, titolo){
  if(!lista || !lista.length) return `<p class="sub"><i>Nessun elemento: composizione non disponibile.</i></p>`;
  const tot = lista.reduce((a,e)=>a+e.massa_kg,0);
  return `<table><thead><tr><th>${titolo||'Elemento'}</th><th>Massa (centrale)</th><th>Range</th><th>% sul totale</th></tr></thead>
    <tbody>${lista.map(e=>`<tr><td class="name" style="${e.elemento===ND_LABEL?'font-style:italic':'font-weight:600;color:var(--ink)'}">${e.elemento===ND_LABEL?'composizione non disponibile':e.elemento}</td>
      <td>${massStr(e.massa_kg)}</td><td>${massStr(e.massa_kg_min)} – ${massStr(e.massa_kg_max)}</td><td>${tot?fmt(e.massa_kg/tot*100,1):'0'}%</td></tr>`).join('')}
    <tr><td class="name" style="font-weight:700">Totale</td><td style="font-weight:700">${massStr(tot)}</td><td></td><td></td></tr></tbody></table>`;
}
function avvisiHtml(u){
  const lim = (u.avvisi||[]).filter(a=>a.tipo==='resa_limitata');
  const nv = (u.avvisi||[]).filter(a=>a.tipo==='non_verificabile');
  let h = '';
  if(lim.length){
    const t = lim.map(a=>`${a.nome} (scenario ${a.scenario||'centrale'}): resa richiesta ${pct(a.resa_richiesta)}, massimo stechiometrico ${pct(a.resa_max_stechiometrica)} (il materiale contiene ${fmt(a.contenuto_elemento_pct,2)}% di ${a.elemento}) → ridotta a ${pct(a.resa_effettiva)}`).join('\n');
    h += `<div class="warn-tag" title="${escAttr(t)}">⚠ resa ridotta al max stechiometrico</div>`;
  }
  if(nv.length){
    const t = nv.map(a=>`${a.nome}: composizione non disponibile (o parziale) — impossibile verificare che contenga abbastanza ${a.elemento}`).join('\n');
    h += `<div class="nv-tag" title="${escAttr(t)}">≈ non verificabile</div>`;
  }
  return h;
}
function raccogliAvvisi(uscite, out, contesto){
  (uscite||[]).forEach(u=>{
    (u.avvisi||[]).filter(a=>a.tipo==='resa_limitata').forEach(a=>out.push({...a, prodotto:u.codice, contesto}));
    if(u.ramo) raccogliAvvisi(u.ramo.uscite, out, contesto+' › '+u.codice);
  });
}
function raccogliAvvisiMat(c, out, contesto){
  (c.avvisi||[]).forEach(a=>out.push({...a, contesto}));
  (c.uscite||[]).forEach(u=>{ if(u.ramo) raccogliAvvisiMat(u.ramo, out, contesto+' › '+u.codice); });
}
function renderAvvisiPanel(componenti){
  const av = [], am = [];
  componenti.forEach(c=>{
    const ctx = c.macro_componente ? c.macro_componente + (c.assieme?' › '+c.assieme:'') : 'Intermedio acquistato';
    raccogliAvvisi(c.uscite, av, ctx);
    raccogliAvvisiMat(c, am, ctx);
  });
  const htmlMat = '';   // nessun controllo sulla somma dei recuperi (sono stechiometrici)
  if(!av.length) return htmlMat;
  return htmlMat + `<div class="panel warn-panel">
    <h3>⚠ Rese ridotte al massimo stechiometrico (${av.length})</h3>
    <p class="sub">Queste rese chiedono più elemento di quello contenuto nel materiale in ingresso: la massa del prodotto (e il ricavo) è stata ridotta al massimo fisicamente possibile. Correggi le rese nella tabella Processi/Sottoprocessi.</p>
    <table><thead><tr><th>Dove</th><th>Materiale in ingresso</th><th>Prodotto</th><th>Scenario</th><th>Contenuto ${''}elemento</th><th>Resa richiesta</th><th>Max stechiometrico</th></tr></thead>
    <tbody>${av.map(a=>`<tr><td class="name">${a.contesto}</td><td class="name">${a.nome}</td><td>${a.prodotto}</td><td>${a.scenario||'centrale'}</td><td>${fmt(a.contenuto_elemento_pct,2)}% ${a.elemento}</td><td>${pct(a.resa_richiesta)}</td><td style="color:var(--red);font-weight:700">${pct(a.resa_max_stechiometrica)}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

function renderScartiCards(macro, path, scarti, massaRif){
  return (scarti||[]).map((p,i)=>{
    const spec = p.speciale;
    // gli elementi non attribuiti compaiono come card solo se rilevanti (>0,5% della massa trattata);
    // restano comunque nel pannello "Elementi persi"
    if(spec==='non_attribuito' && p.elementi.reduce((a,e)=>a+e.massa_kg,0) < 0.005*(massaRif||0)) return '';
    const titolo = spec==='non_allocato' ? 'Non allocato' : spec==='non_attribuito' ? 'Non attribuiti' : 'Scarto';
    const sub = spec==='non_allocato' ? 'somma recuperi < 1' : spec==='non_attribuito' ? 'elementi senza uscita' : p.scarto;
    const tip = spec==='non_allocato' ? 'Massa dei materiali per cui la somma dei recuperi è minore di 1'
      : spec==='non_attribuito' ? 'Elementi presenti nei materiali in ingresso che il bilancio per elemento non riesce ad attribuire a nessuna uscita (la massa è già tutta assegnata). Indica rese incoerenti con la composizione.'
      : 'Scarto: ' + p.scarto;
    return `<div class="output-card scarto clickable ${spec?'spec-'+spec:''}" data-scarto-macro="${escAttr(macro)}" data-path="${escAttr(path.join('>'))}" data-idx="${i}" title="${escAttr(tip)}">
      <div class="sym" style="color:var(--mute);font-size:12px">${titolo}</div>
      <div class="nm" title="${escAttr(p.scarto)}">${spec?sub:'→ '+sub}</div>
      <div class="val">${spec==='non_attribuito' ? massStr(p.elementi.reduce((a,e)=>a+e.massa_kg,0))+' el.' : massStr(p.massa_kg)}</div>
      ${spec!=='non_attribuito' ? `<div class="price-tag">${massStr(p.massa_kg_min)} – ${massStr(p.massa_kg_max)}</div>` : ''}
      ${p.costo_smaltimento_eur>0 ? `<div class="vv" style="color:var(--copper)">− ${eur(p.costo_smaltimento_eur).join(' ')}</div>` : ''}
      ${elTop(p.elementi,2) ? `<div class="el-tag">${elTop(p.elementi,2)}</div>` : ''}
    </div>`;
  }).join('');
}

// massa di un'uscita: in grande il TOTALE (puro + impurità), sotto le due parti separate.
// Senza impurità resta la sola massa (totale = puro).
function massaUscitaHtml(massa, imp, impDa, contr){
  // da dove arriva la parte pura: materiale in ingresso × resa = massa
  const daPuro = (contr||[]).map(x=> x.massa_ingresso_kg>0
    ? `${x.nome}: ${massStr(x.massa_ingresso_kg)} × ${fmt(x.massa_kg/x.massa_ingresso_kg*100,2)}% = ${massStr(x.massa_kg)}`
    : `${x.nome}: ${massStr(x.massa_kg)}`).join('\n');
  const tipPuro = daPuro ? 'Parte pura (la sola valorizzata) proveniente da:\n'+escAttr(daPuro) : '';
  if(!(imp>0)) return `<div class="val" ${tipPuro?`title="${tipPuro}" style="cursor:help"`:''}>${massStr(massa)}</div>`;
  const da = (impDa||[]).map(x=>`${x.nome}: ${massStr(x.massa_kg)} (${pct(x.pct)})`).join('\n');
  const tot = massa + imp;
  // quota delle impurità sul totale, con più decimali quando è piccola (altrimenti totale e
  // puro, arrotondati alla stessa unità, sembrano uguali)
  const q = imp/tot*100, quota = fmt(q, q<0.1?3:q<10?2:1) + '%';
  return `<div class="val" title="Massa totale in uscita: prodotto puro + impurità">${massStr(tot)}</div>
      <div class="pure-tag" title="${tipPuro || 'Parte pura: è la sola massa valorizzata'}">puro ${massStr(massa)}</div>
      <div class="imp-tag" title="Impurità (${pct(imp/tot)} del totale, non valorizzate)${da?' provenienti da:\n'+escAttr(da):''}">impurità ${massStr(imp)} (${quota})</div>`;
}

function renderUscitaCard(macro, path, u){
  const range = `${massStr(u.massa_kg_min)} – ${massStr(u.massa_kg_max)}`;
  if(u.tipo==='prodotto'){
    const cls = (u.prezzo_personalizzato ? 'custom' : 'default') + ((u.avvisi||[]).some(a=>a.tipo==='resa_limitata') ? ' warn' : '');
    return `<div class="output-card clickable ${cls}" data-price-prodotto="${u.codice}" title="Range ${range}. Clic per prezzo e andamento di mercato">
      <span class="cat" style="background:${CATCOL[u.categoria]||'var(--mute)'}"></span>
      <div class="sym ${u.codice.length>7?'sym-long':''}" title="${escAttr(u.codice)}">${u.codice}</div><div class="nm">${u.nome||''}</div>
      ${massaUscitaHtml(u.massa_kg, u.impurita_kg, u.impurita_da, u.contributi)}
      <div class="vv">${eur(u.ricavo_eur).join(' ')}${u.prezzo_personalizzato?' ✎':''}</div>
      ${(u.elementi_da_reagenti||[]).length ? `<div class="nv-tag" title="${escAttr('Elementi della formula non presenti nei materiali: si assumono dai reagenti aggiunti (nessun controllo):\n'+u.elementi_da_reagenti.map(e=>e.elemento+' '+massStr(e.massa_kg)).join('\n'))}">+ reagenti: ${u.elementi_da_reagenti.slice(0,2).map(e=>e.elemento).join(', ')}</div>` : ''}
      ${avvisiHtml(u)}
    </div>`;
  }
  const childPath = [...path, u.codice];
  if(u.trasformato && u.ramo){
    const ramo = u.ramo, sp = ramo.sottoprocesso;
    return `<div class="output-branch">
      <div class="output-card intermedio-header" title="Range ${range}">
        <div class="sym ${u.codice.length>7?'sym-long':''}" style="color:var(--gold)" title="${escAttr(u.codice)}">${u.codice}</div><div class="nm">${u.nome||''}</div>
        ${massaUscitaHtml(u.massa_kg, u.impurita_kg, u.impurita_da, u.contributi)}
        ${compTop(u.composizione) ? `<div class="el-tag" title="Composizione calcolata (parte pura):\n${escAttr(compTitle(u.composizione))}">${compTop(u.composizione)}</div>` : ''}
        <div class="trasforma-tag" data-annulla-macro="${escAttr(macro)}" data-path="${escAttr(childPath.join('>'))}">Trasformato ✕</div>
      </div>
      <span class="lane-arrow">→</span>
      <div class="lane-node">
        ${renderSottoprocessoSelectHtml(macro, childPath)}
        ${tagliaHtml(null, sp, false)}
        <div class="lane-node-cost">Capex attribuito ${eur(sp.capex_eur).join(' ')} · Opex ${eur(sp.opex_eur).join(' ')}</div>
        <div class="lane-node-costo-tot">Costo: ${eur(sp.costo_eur).join(' ')}</div>
        ${reagentiNodeHtml(ramo.reagenti)}
        <div class="lane-node-fasi">${fasiCompact(sp.descrizione_fasi)}</div>
      </div>
      <span class="lane-arrow">→</span>
      ${renderUsciteBox(macro, childPath, nice(sp.tecnica), ramo.uscite, ramo.scarti, null)}
    </div>`;
  }
  const cls = u.prezzo_personalizzato ? 'custom' : 'default';
  return `<div>
    <div class="output-card clickable ${cls}" data-price-intermedio="${u.codice}" title="Range ${range}\nComposizione calcolata (parte pura):\n${escAttr(compTitle(u.composizione))}">
      <div class="sym ${u.codice.length>7?'sym-long':''}" style="color:var(--gold)" title="${escAttr(u.codice)}">${u.codice}</div><div class="nm">${u.nome||''}</div>
      ${massaUscitaHtml(u.massa_kg, u.impurita_kg, u.impurita_da, u.contributi)}
      ${compTop(u.composizione) ? `<div class="el-tag">${compTop(u.composizione)}</div>` : ''}
      <div class="vv">${eur(u.ricavo_eur).join(' ')}${u.prezzo_personalizzato?' ✎':''}</div>
    </div>
    <button class="btn-trasforma" data-trasforma-macro="${escAttr(macro)}" data-path="${escAttr(childPath.join('>'))}">Trasforma ▸</button>
  </div>`;
}

function renderSottoprocessoSelectHtml(macro, path){
  const node = getFiglioState(macro, path, true);
  const opts = node.sottoprocessoOptions || [];
  if(opts.length<=1) return `<div class="lane-node-title">${nice(opts[0]?.tecnica)}</div>`;
  return `<select class="sel-sottoprocesso" data-macro="${escAttr(macro)}" data-path="${escAttr(path.join('>'))}">
    ${opts.map(o=>`<option value="${o.id_sottoprocesso}" ${o.id_sottoprocesso===node.idSottoprocesso?'selected':''}>${nice(o.tecnica)}</option>`).join('')}
  </select>`;
}

// trova (nel risultato dell'ultimo calcolo) le uscite/perso al percorso dato
function trovaNodo(macro, path){
  let base;
  if(macro==='DIRETTO') base = {uscite:lastCalc.uscite, scarti:lastCalc.scarti, non_trattato:null};
  else base = lastCalc.componenti.find(c=>cdKey(c)===macro);
  for(const code of path){
    const u = base.uscite.find(x=>x.codice===code && x.ramo);
    if(!u) return null;
    base = {uscite:u.ramo.uscite, scarti:u.ramo.scarti};
  }
  return base;
}

function wireSchemaProcesso(){
  document.querySelectorAll('.sel-processo').forEach(sel=>{
    sel.onchange = ()=>{ const c=calcState.componenti[sel.dataset.macro]; c.idProcesso=sel.value; c.figli={}; c.taglia=null; renderCalcoloMain(); };
  });
  document.querySelectorAll('.inp-taglia').forEach(inp=>{
    inp.onchange = ()=>{
      const c = calcState.componenti[inp.dataset.lane];
      const v = +inp.value;
      c.taglia = v > 0 ? v : null;     // vuoto: al prossimo calcolo si propone di nuovo (tratta la massa in 1 anno)
      c.tagliaProposta = false;
      renderCalcoloMain();
    };
  });
  document.querySelectorAll('.inp-anno-costr').forEach(inp=>{
    inp.onchange = ()=>{
      const c = calcState.componenti[inp.dataset.lane];
      const v = +inp.value;
      c.annoCostr = v >= ANNO_CORRENTE ? v : null;
      renderCalcoloMain();
    };
  });
  const inpTd = document.getElementById('inpTagliaDiretto');
  if(inpTd) inpTd.onchange = ()=>{ const v=+inpTd.value; calcState.diretto.taglia = v>0 ? v : null; renderCalcoloMain(); };
  document.querySelectorAll('.btn-trasforma').forEach(btn=>{
    btn.onclick = async ()=>{
      const macro = btn.dataset.trasformaMacro, path = btn.dataset.path.split('>');
      const nodeState = getFiglioState(macro, path, true);
      if(!nodeState.sottoprocessoOptions)
        nodeState.sottoprocessoOptions = await apiGet('/filtri/sottoprocessi', {intermedio: path[path.length-1]});
      if(!nodeState.sottoprocessoOptions.length){ alert(`Nessun sottoprocesso definito per l'intermedio ${path[path.length-1]}.`); return; }
      nodeState.processing = true;
      if(!nodeState.idSottoprocesso) nodeState.idSottoprocesso = nodeState.sottoprocessoOptions[0].id_sottoprocesso;
      renderCalcoloMain();
    };
  });
  document.querySelectorAll('[data-annulla-macro]').forEach(t=>{
    t.onclick = ()=>{
      const nodeState = getFiglioState(t.dataset.annullaMacro, t.dataset.path.split('>'), true);
      nodeState.processing = false; nodeState.idSottoprocesso = null; nodeState.figli = {};
      renderCalcoloMain();
    };

  document.querySelectorAll('.sel-sottoprocesso').forEach(sel=>{
    sel.onchange = ()=>{
      const nodeState = getFiglioState(sel.dataset.macro, sel.dataset.path.split('>'), true);

      renderCalcoloMain();
    };
  });

  document.querySelectorAll('[data-scarto-macro]').forEach(b=>{
    b.onclick = ()=>{
      const path = b.dataset.path ? b.dataset.path.split('>') : [];
      const nodo = trovaNodo(b.dataset.scartoMacro, path);
      const p = nodo?.scarti?.[+b.dataset.idx]; if(!p) return;
      const spec = p.speciale;
      const titolo = spec==='non_allocato' ? 'Massa non allocata (somma recuperi < 1)'
        : spec==='non_attribuito' ? 'Elementi non attribuiti (bilancio per elemento)' : 'Scarto → '+p.scarto;
      const nota = spec==='non_attribuito'
        ? `Questi elementi sono presenti nei materiali in ingresso ma nessuna uscita li contiene: la massa dei materiali è già tutta assegnata
           a prodotti, impurità e scarti, ma le uscite non hanno abbastanza di questi elementi. Di solito indica che un prodotto con formula
           (es. Li₂CO₃) recupera meno elemento di quello presente e che il resto non è stato assegnato a nessuno scarto.`
        : `Totale centrale <b>${massStr(p.massa_kg)}</b> (range ${massStr(p.massa_kg_min)} – ${massStr(p.massa_kg_max)})${p.costo_smaltimento_eur_ton>0?` · smaltimento ${fmt(p.costo_smaltimento_eur_ton,0)} €/t → ${eur(p.costo_smaltimento_eur).join(' ')}`:''}.`;
      const ov = showModal(`
        <h3>${titolo}</h3>
        <p class="sub">${nota}</p>
        <h4 class="mh">Elementi</h4>
        <p class="sub">Bilancio per elemento: elementi in ingresso − elementi catturati dai prodotti con formula − elementi portati dalle altre uscite.</p>
        ${elTableHtml(p.elementi)}
        <h4 class="mh">Per materiale in ingresso</h4>
        <table><thead><tr><th>Materiale in ingresso</th>${spec==='non_attribuito'?'':'<th>% del materiale</th><th>Massa</th>'}<th style="text-align:left">Elementi principali</th></tr></thead>
        <tbody>${p.materiali.map(m=>`<tr><td class="name">${m.nome}</td>${spec==='non_attribuito'?'':`<td>${pct(m.pct)}</td><td>${massStr(m.massa_kg)}</td>`}<td style="text-align:left;white-space:normal;font-size:11px;color:var(--mute)">${elTop(m.elementi,4)||'<i>n.d.</i>'}</td></tr>`).join('')}</tbody></table>
        <div class="modal-close"><button class="btn" id="btnCloseModal">Chiudi</button></div>`);
      ov.querySelector('.modal').classList.add('wide');
      document.getElementById('btnCloseModal').onclick=()=>ov.remove();
    };
  });
  document.querySelectorAll('[data-nontrattato-macro]').forEach(b=>{
    b.onclick = ()=>{
      const c = lastCalc.componenti.find(x=>cdKey(x)===b.dataset.nontrattatoMacro);
      const nt = c.non_trattato;
      const ov = showModal(`
        <h3>Materiale non trattato — ${c.macro_componente}${c.assieme?' › '+c.assieme:''}</h3>
        <p class="sub">Materiali per cui il processo "${nice(c.processo.tecnica)}" non prevede alcuna uscita. Totale <b>${massStr(nt.massa_kg)}</b>.</p>
        <h4 class="mh">Elementi contenuti</h4>
        ${elTableHtml(nt.elementi)}
        <h4 class="mh">Materiali</h4>
        <table><thead><tr><th>Materiale</th><th>Material ID</th><th>Massa</th></tr></thead>
        <tbody>${nt.materiali.map(m=>`<tr><td class="name">${m.material}</td><td class="name">${m.material_id}</td><td>${massStr(m.massa_kg)}</td></tr>`).join('')}</tbody></table>
        <div class="modal-close"><button class="btn" id="btnCloseModal">Chiudi</button></div>`);
      ov.querySelector('.modal').classList.add('wide');
      document.getElementById('btnCloseModal').onclick=()=>ov.remove();

  });
  document.querySelectorAll('[data-separa]').forEach(b=>{ b.onclick = ()=>openSeparaAssiemi(b.dataset.separa); });
  document.querySelectorAll('[data-riunisci]').forEach(b=>{
    b.onclick = ()=>{
      const c = calcState.componenti[b.dataset.riunisci];
      calcState.separati[c.macro] = (calcState.separati[c.macro]||[]).filter(a=>a!==c.assieme);
      rebuildLanes(); renderCalcoloMain();
    };
  });
}

async function openMaterialiModal(lane){
  const c = calcState.componenti[lane];
  const titolo = c.macro + (c.assieme ? ' › '+c.assieme : '');
  const ov = showModal(`<h3>Materiali — ${titolo}</h3><p class="sub">Caricamento…</p>`);
  ov.querySelector('.modal').classList.add('wide');
  let mats;
  try{ mats = await apiSend('POST', '/filtri/materiali-componente', {id_imps:calcState.impianti, macro_componente:c.macro,
        assieme:c.assieme, escludi_assiemi: c.assieme ? null : (calcState.separati[c.macro]||[])}); }
  catch(e){ ov.querySelector('.modal').innerHTML = `<h3>Errore</h3><p class="sub">${e.message}</p>`; return; }
  const tot = mats.reduce((a,m)=>a+m.massa_kg,0);
  const cd = lastCalc?.componenti.find(x=>cdKey(x)===lane);
  const trattati = new Set();
  const addK = k => trattati.add(k.ingresso.split('@@')[0]);
  (cd?.uscite||[]).forEach(u=>{ u.contributi.forEach(addK); u.impurita_da.forEach(addK); });
  (cd?.scarti||[]).forEach(p=>p.materiali.forEach(addK));
  // elementi contenuti nei soli materiali trattati (massa x composizione)
  const elTratt = {};
  let massaTratt = 0;
  mats.filter(m=>trattati.has(m.material_id)).forEach(m=>{
    massaTratt += m.massa_kg;
    const somma = m.composizione.reduce((a,x)=>a+x.frazione_pct,0);
    const k = somma>100 ? 100/somma : 1;
    m.composizione.forEach(x=>{ elTratt[x.elemento] = (elTratt[x.elemento]||0) + m.massa_kg*x.frazione_pct/100*k; });
    const nd = m.massa_kg*Math.max(0, 1 - somma*k/100);
    if(nd>1e-9) elTratt[ND_LABEL] = (elTratt[ND_LABEL]||0) + nd;
  });
  const elRows = Object.entries(elTratt).sort((a,b)=>(a[0]===ND_LABEL)-(b[0]===ND_LABEL) || b[1]-a[1]);
  const tabElTratt = !elRows.length ? '<p class="sub"><i>Nessun materiale trattato.</i></p>' : `
    <table><thead><tr><th>Elemento</th><th>Massa</th><th>% sulla massa trattata</th></tr></thead>
    <tbody>${elRows.map(([e,v])=>`<tr><td class="name" style="${e===ND_LABEL?'font-style:italic':'font-weight:600;color:var(--ink)'}">${e===ND_LABEL?'composizione non disponibile':e}</td><td>${massStr(v)}</td><td>${fmt(v/massaTratt*100, v/massaTratt<0.001?3:2)}%</td></tr>`).join('')}
      <tr><td class="name" style="font-weight:700">Totale</td><td style="font-weight:700">${massStr(massaTratt)}</td><td></td></tr></tbody></table>`;
  const multi = calcState.impianti.length > 1;
  // contributo di ogni impianto al macrocomponente (somma dei materiali)
  const perImp = {};
  mats.forEach(m=>(m.impianti||[]).forEach(x=>{
    const r = perImp[x.id_imp] ||= {nome:x.nome, tot:0, tratt:0};
    r.tot += x.massa_kg; if(trattati.has(m.material_id)) r.tratt += x.massa_kg;
  }));
  const rigaDet = (sx, dx) => `<div style="display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:2px 0"><span>${sx}</span><span>${dx}</span></div>`;
  const tabImp = !multi ? '' : `
    <h4 class="mh">Contributo di ogni impianto</h4>
    <table><thead><tr><th>Impianto</th><th>Massa</th><th>%</th><th>di cui trattata</th></tr></thead>
    <tbody>${Object.values(perImp).sort((a,b)=>b.tot-a.tot).map(r=>`<tr><td class="name">${r.nome}</td><td>${massStr(r.tot)}</td>
      <td>${fmt(r.tot/tot*100,1)}%</td><td style="color:var(--green)">${massStr(r.tratt)}</td></tr>`).join('')}</tbody></table>`;
  ov.querySelector('.modal').innerHTML = `
    <h3>Materiali — ${titolo}</h3>
    <p class="sub">${mats.length} materiali, massa totale <b>${massStr(tot)}</b>${multi?` da <b>${calcState.impianti.length} impianti</b>`:''}, di cui <b style="color:var(--green)">${massStr(massaTratt)} trattati</b> dal processo selezionato (${tot?fmt(massaTratt/tot*100,1):0}%, materiali in verde). Materiali uguali sommati su ${multi?'impianti e ':''}assiemi: clicca su una riga per il dettaglio per ${multi?'impianto e ':''}assieme.</p>
    ${tabImp}
    <table><thead><tr><th>Materiale</th><th>Massa</th><th>%</th>${multi?'<th>Impianti</th>':''}<th>Assiemi</th><th style="text-align:left">Composizione (% in massa)</th></tr></thead>
    <tbody>${mats.map((m,i)=>`<tr class="mat-row" data-i="${i}" style="cursor:pointer">
      <td class="name" style="white-space:normal;${trattati.has(m.material_id)?'color:var(--green);font-weight:600':''}">${m.material}<div style="font-size:10px;color:var(--mute);font-weight:400">${m.material_id}</div></td>
      <td>${massStr(m.massa_kg)}</td><td>${fmt(m.massa_kg/tot*100,1)}%</td>${multi?`<td>${(m.impianti||[]).length}</td>`:''}<td>${new Set(m.assiemi.map(a=>a.assieme)).size}</td>
      <td style="text-align:left;white-space:normal;font-size:11px;color:var(--mute)">${m.composizione.length ? m.composizione.slice(0,6).map(x=>`${x.elemento} ${fmt(x.frazione_pct, x.frazione_pct<1?2:1)}`).join(' · ')+(m.composizione.length>6?' …':'') : '<i>non disponibile</i>'}</td>
    </tr><tr class="mat-det" data-i="${i}" hidden><td colspan="${multi?6:5}" style="text-align:left;background:#F8F9F5;white-space:normal">
      ${multi ? `<div style="font-weight:700;font-size:11px;margin-bottom:2px">Per impianto</div>`
        + (m.impianti||[]).map(x=>rigaDet(x.nome, massStr(x.massa_kg))).join('')
        + `<div style="font-weight:700;font-size:11px;margin:6px 0 2px">Per assieme</div>` : ''}
      ${Object.entries(m.assiemi.reduce((o,a)=>{ o[a.assieme] = (o[a.assieme]||0) + a.massa_kg; return o; }, {}))
          .sort((a,b)=>b[1]-a[1]).map(([a,kg])=>rigaDet(a||'<i>livello 1</i>', massStr(kg))).join('')}
    </td></tr>`).join('')}</tbody></table>
    <h4 class="mh">Elementi contenuti nei materiali trattati (${massStr(massaTratt)})</h4>
    <p class="sub">Massa di ogni elemento = massa del materiale × frazione della sua composizione, sommata sui soli materiali in verde.</p>
    ${tabElTratt}
    <div class="modal-close"><button class="btn" id="btnCloseModal">Chiudi</button></div>`;
  ov.querySelectorAll('.mat-row').forEach(r=>{ r.onclick = ()=>{ const d = ov.querySelector(`.mat-det[data-i="${r.dataset.i}"]`); d.hidden = !d.hidden; }; });
  document.getElementById('btnCloseModal').onclick=()=>ov.remove();
}

async function renderCalcoloMainDiretto(){
  const main = document.getElementById('main');
  const d = calcState.diretto;
  const ready = d.intermedio && d.idSottoprocesso && d.massaTon>0;
  const pathHtml = pathBar([['Intermedio',d.intermedio],['Quantità',d.massaTon?d.massaTon+' t':''],['Anno',calcState.annoDismissione]]);
  if(!ready){
    main.innerHTML = pathHtml + `<div class="empty-state">${d.intermedio && !d.sottoprocessoOptions.length ? `Nessun sottoprocesso definito per ${d.intermedio}.` : 'Completa la selezione a sinistra per vedere lo schema del processo.'}</div>`;
    return;
  }
  const myId = ++calcRequestId;
  main.innerHTML = pathHtml + `<div class="empty-state">Calcolo in corso…</div>`;
  let data;
  try{
    data = await apiSend('POST', '/calcolo-da-intermedio', {
      intermedio:d.intermedio, massa_ton:d.massaTon, id_sottoprocesso:d.idSottoprocesso,
      anno_dismissione: calcState.annoDismissione, anno_corrente: ANNO_CORRENTE, id_indice_costi: calcState.indiceCosti,
      prezzo_acquisto_override: d.prezzoAcquistoOverride,
      prezzi_prodotti_override: calcState.prezziManuali.prodotti,
      prezzi_intermedi_override: calcState.prezziManuali.intermedi,
      figli_sottoprocesso: buildFigliPayload(d.figli),
      taglia_t_anno: d.taglia || null,
    });
  }catch(e){
    if(myId!==calcRequestId) return;
    main.innerHTML = pathHtml + `<div class="empty-state">Errore nel calcolo: ${e.message}</div>`;
    return;
  }
  if(myId!==calcRequestId) return;
  lastCalc = data;
  main.innerHTML = pathHtml
    + renderAvvisiPanel([{uscite:data.uscite, avvisi:data.avvisi}])
    + renderSchemaDiretto(data, d)
    + renderMaterialeRecuperatoPanel([{uscite:data.uscite}])
    + `<div class="panel"><h3>Elementi persi</h3><p class="sub">Non disponibili: l'intermedio acquistato non ha un'origine nota nel database, quindi la sua composizione elementare non si può calcolare.</p></div>`
    + renderEconomicSummary(data, 'Quantità acquistata', data.massa_input_kg, `acquisto ${eur(data.acquisto.costo_eur).join(' ')}`);
  wireSchemaProcesso();
  wirePriceTiles();
  document.querySelectorAll('[data-price-acquisto]').forEach(t=>{ t.onclick = ()=>openPriceModalAcquisto(); });
  document.querySelectorAll('.sel-sottoprocesso-diretto').forEach(sel=>{
    sel.onchange = ()=>{ d.idSottoprocesso=sel.value; d.figli={}; renderCalcoloMain(); };
  });
}

function renderSchemaDiretto(data, d){

  return `<div class="panel">
    <h3>Schema del processo</h3>
    <p class="sub">Intermedio acquistato e lavorato — nessun impianto coinvolto, si parte dalla quantità indicata.</p>
    <div class="lane"><div class="lane-row">
      <div class="output-card clickable ${acq.prezzo_personalizzato?'custom':'default'}" data-price-acquisto="1">
        <div class="sym" style="font-size:13px;color:var(--copper)">${d.intermedio}</div>
        <div class="nm">acquistato</div>

// ============================================================
// Grafici storici (SVG inline, nessuna libreria esterna)
//   un grafico per misura (nessun doppio asse), una sola serie ciascuno
// ============================================================
const CHART_SERIES = [
  {key:'prezzo_usd_t', title:'Prezzo LME (cash/settlement)', unit:'$/t', kind:'line', color:'#B5651D', dec:0},
  {key:'produzione_eu_kt', title:'Produzione EU27', unit:'migliaia di t', kind:'bar', color:'#2E7A5B', dec:2},
  {key:'consumo_mondiale_mt', title:'Consumo mondiale (primario)', unit:'milioni di t', kind:'line', color:'#6E5AA8', dec:3},
];
function niceTicks(max){
  if(!(max>0)) return [0,1];
  const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw) || raw;
  const ticks=[]; for(let v=0; v<=max+step*0.001; v+=step) ticks.push(+v.toPrecision(12));
  if(ticks[ticks.length-1]<max) ticks.push(+(ticks[ticks.length-1]+step).toPrecision(12));
  return ticks;
}
function fmtTick(v){
  const a=Math.abs(v);
  if(a>=1e6) return fmt(v/1e6, v%1e6?1:0)+' M';
  if(a>=1e4) return fmt(v/1e3, 0)+' k';
  if(a>=100) return fmtInt(v);
  if(a>=1) return fmt(v, v%1?1:0);
  return fmt(v, 3).replace(/0+$/,'').replace(/,$/,'');
}
function svgChart(rows, s, w, h){
  const pts = rows.filter(r=>r[s.key]!=null).map(r=>({x:r.anno, y:+r[s.key]}));
  if(!pts.length) return `<div class="chart-empty">Nessun dato</div>`;
  const anni = rows.map(r=>r.anno), x0=Math.min(...anni), x1=Math.max(...anni);
  const ticks = niceTicks(Math.max(...pts.map(p=>p.y)));
  const yMax = ticks[ticks.length-1];
  const m = {l:48, r:12, t:10, b:22}, iw=w-m.l-m.r, ih=h-m.t-m.b;
  const band = iw/(x1-x0+1);
  const X = a => m.l + (a-x0+0.5)*band;
  const Y = v => m.t + ih - v/yMax*ih;
  let g = ticks.map(t=>`<line x1="${m.l}" x2="${w-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#E2E6DD" stroke-width="1"/>
    <text x="${m.l-6}" y="${Y(t)+3.5}" text-anchor="end" class="ax">${fmtTick(t)}</text>`).join('');
  const step = Math.ceil((x1-x0+1)/8);
  for(let a=x0; a<=x1; a+=step) g += `<text x="${X(a)}" y="${h-6}" text-anchor="middle" class="ax">${a}</text>`;
  let marks = '';
  if(s.kind==='bar'){
    const bw = Math.min(24, band-2);
    marks = pts.map(p=>{
      const y=Y(p.y), x=X(p.x)-bw/2, hh=m.t+ih-y, r=Math.min(4,hh);
      return `<path d="M${x},${m.t+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${m.t+ih} Z" fill="${s.color}"/>`;
    }).join('');
  } else {
    // spezza la linea dove mancano anni (nessuna interpolazione inventata)
    let d='', prev=null;
    pts.forEach(p=>{ d += (prev!==null && p.x===prev+1 ? 'L' : 'M') + X(p.x)+','+Y(p.y)+' '; prev=p.x; });
    const last = pts[pts.length-1];
    marks = `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
  }
  const hits = pts.map(p=>`<rect class="hit" x="${X(p.x)-band/2}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"
     data-anno="${p.x}" data-val="${p.y}" data-cx="${X(p.x)}" data-cy="${Y(p.y)}"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${escAttr(s.title)}" data-unit="${escAttr(s.unit)}" data-dec="${s.dec}">
    ${g}${marks}<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="#9AA59E" stroke-width="1" visibility="hidden"/>
    <circle class="xdot" r="4" fill="${s.color}" stroke="#fff" stroke-width="2" visibility="hidden"/>${hits}</svg>`;
}
function renderStoricoCharts(rows){
  if(!rows || !rows.length)
    return `<div class="chart-note">Nessuno storico di mercato in database per questo prodotto (tabella <code>db_prodotti_storico</code>).</div>`;
  const fonte = [...new Set(rows.map(r=>r.fonte).filter(Boolean))].join(', ');
  const esempio = /ESEMPIO/i.test(fonte);
  const last = k => { const r=[...rows].reverse().find(r=>r[k]!=null); return r ? `${fmtTick(+r[k])} (${r.anno})` : '—'; };
  const card = (s, w, h) => `<div class="chart-card">
      <div class="chart-title">${s.title} <span>${s.unit}</span></div>
      <div class="chart-last">ultimo: ${last(s.key)}</div>
      ${svgChart(rows, s, w, h)}</div>`;
  return `<div class="charts">
    ${esempio ? `<div class="chart-warn">⚠ Dati di esempio, da sostituire con i dati reali (tabella "Storico prezzi").</div>` : ''}
    ${card(CHART_SERIES[0], 720, 170)}
    <div class="chart-row">${card(CHART_SERIES[1], 350, 150)}${card(CHART_SERIES[2], 350, 150)}</div>
    <div class="chart-note">Fonte: ${fonte||'—'}. Passa il mouse sui grafici per i valori annuali.</div>
    <div class="chart-tip" hidden></div>
  </div>`;
}
function wireCharts(root){
  const tip = root.querySelector('.chart-tip'); if(!tip) return;
  root.querySelectorAll('.charts svg').forEach(svg=>{
    const xh = svg.querySelector('.xhair'), xd = svg.querySelector('.xdot');
    svg.querySelectorAll('.hit').forEach(r=>{
      r.addEventListener('mouseenter', ()=>{
        const cx=+r.dataset.cx, cy=+r.dataset.cy;
        xh.setAttribute('x1',cx); xh.setAttribute('x2',cx); xh.setAttribute('visibility','visible');
        xd.setAttribute('cx',cx); xd.setAttribute('cy',cy); xd.setAttribute('visibility','visible');
        tip.innerHTML = `<b>${r.dataset.anno}</b> · ${fmt(+r.dataset.val, +svg.dataset.dec)} ${svg.dataset.unit}`;
        tip.hidden = false;
        const box = root.querySelector('.charts').getBoundingClientRect(), rb = r.getBoundingClientRect();
        tip.style.left = Math.min(box.width-150, Math.max(0, rb.left - box.left + rb.width/2 - 60))+'px';
        tip.style.top = (rb.top - box.top - 8)+'px';
      });
      r.addEventListener('mouseleave', ()=>{ xh.setAttribute('visibility','hidden'); xd.setAttribute('visibility','hidden'); tip.hidden = true; });
    });
  });
}

let elementiPersiDettaglio = null;
function raccogliPerso(uscite, scarti, contesto, out){
  (scarti||[]).forEach(p=>out.push({contesto, destinazione:p.speciale==='non_attribuito'?'non attribuiti':p.speciale==='non_allocato'?'non allocato':p.scarto, elementi:p.elementi}));
  (uscite||[]).forEach(u=>{ if(u.ramo) raccogliPerso(u.ramo.uscite, u.ramo.scarti, contesto+' › '+u.codice+' ('+nice(u.ramo.sottoprocesso.tecnica).toLowerCase()+')', out); });
}
function renderElementiPersiPanel(componenti){
  const fonti = [], nt = [];
  componenti.forEach(c=>{
    const ctx = c.macro_componente ? c.macro_componente + (c.assieme ? ' › '+c.assieme : '') : 'Intermedio acquistato';
    raccogliPerso(c.uscite, c.scarti, ctx, fonti);
    if(c.non_trattato) nt.push({contesto:ctx, elementi:c.non_trattato.elementi});
  });
  const agg = {};
  const get = e => agg[e] ||= {elemento:e, persoMin:0, perso:0, persoMax:0, nt:0};
  fonti.forEach(f=>f.elementi.forEach(e=>{ const a=get(e.elemento); a.persoMin+=e.massa_kg_min; a.perso+=e.massa_kg; a.persoMax+=e.massa_kg_max; }));
  nt.forEach(f=>f.elementi.forEach(e=>{ get(e.elemento).nt += e.massa_kg; }));
  const rows = Object.values(agg).filter(r=>r.persoMax>1e-6||r.nt>1e-6).sort((a,b)=>(a.elemento===ND_LABEL)-(b.elemento===ND_LABEL) || (b.perso-a.perso) || (b.nt-a.nt));
  if(!rows.length) return '';
  elementiPersiDettaglio = {fonti, nt, rows};
  const tot = k => rows.reduce((s,r)=>s+r[k],0);
  const hasNt = nt.length>0;
  const top = rows.filter(r=>r.elemento!==ND_LABEL).slice(0,4).map(r=>`${r.elemento} ${massStr(r.perso)}`).join(' · ');
  return `
  <div class="panel">
    <h3>Elementi persi</h3>
    <div class="el-summary clickable" id="cardElementiPersi" title="Apri la tabella di dettaglio per elemento">
      <div class="el-sum-main">
        <div class="k">Negli scarti</div>
        <div class="v">${massStr(tot('perso'))}</div>
        <div class="s">range ${massStr(tot('persoMin'))} – ${massStr(tot('persoMax'))}</div>
      </div>
      ${hasNt ? `<div class="el-sum-main">
        <div class="k">Non trattato</div>
        <div class="v">${massStr(tot('nt'))}</div>
        <div class="s">materiali senza processo</div>
      </div>` : ''}
      <div class="el-sum-top">
        <div class="k">Elementi principali (scarti)</div>
        <div class="t">${top||'—'}</div>
        <div class="s">${rows.length} elementi · clicca per il dettaglio ▸</div>
      </div>
    </div>
  </div>`;
}
