services:
  - type: web
    name: recupero-materie
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recupero-materie-db
          property: connectionString

databases:
  - name: recupero-materie-db
    plan: free
    ipAllowList: []